version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      application-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
