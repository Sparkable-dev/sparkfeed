name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Review dependency changes
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      # Dependency Review requires Advanced Security for private repositories.
      # Keep an enforceable audit when that API is unavailable.
      - name: Install Bun for private-repository audits
        if: ${{ github.event.repository.private }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Audit private-repository dependencies
        if: ${{ github.event.repository.private }}
        run: |
          bun ci
          bun audit
          cd docs
          bun install --frozen-lockfile
          bun audit
