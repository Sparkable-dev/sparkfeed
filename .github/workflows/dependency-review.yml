name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Review dependency changes
        id: dependency_review
        if: ${{ !github.event.repository.private }}
        # The API can be unavailable even for public repositories. The full
        # lockfile audits below remain mandatory regardless of this result.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Enforce reported dependency-policy violations
        if: ${{ steps.dependency_review.outcome == 'failure' }}
        env:
          VULNERABLE_CHANGES: ${{ steps.dependency_review.outputs.vulnerable-changes }}
          INVALID_LICENSE_CHANGES: ${{ steps.dependency_review.outputs.invalid-license-changes }}
          DENIED_CHANGES: ${{ steps.dependency_review.outputs.denied-changes }}
        run: |
          node <<'NODE'
          for (const key of ['VULNERABLE_CHANGES', 'INVALID_LICENSE_CHANGES', 'DENIED_CHANGES']) {
            if (JSON.parse(process.env[key] || '[]').length > 0) {
              console.error(`${key} contains dependency-policy violations.`)
              process.exitCode = 1
            }
          }
          NODE
          echo '::warning::Dependency Review failed; full lockfile audits remain required.'

      - name: Install Bun for dependency audits
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Audit application and documentation dependencies
        run: |
          bun ci
          bun audit
          cd docs
          bun install --frozen-lockfile
          bun audit
