# Railway deployment config for the SparkFeed app (repo root service).
#
# Force Railpack so Railway does not auto-detect the Community Dockerfile.
# Railway's config values are case-sensitive and must use `RAILPACK`.
# Railpack detects Bun from bun.lock and installs dependencies before the build.
#
# Demo vs. beta is controlled by Railway service variables:
#   • Demo: VITE_DEMO_MODE=true and DEMO_MODE=true
#   • Beta: VITE_DEMO_MODE=false and DEMO_MODE=false
# Demo mode bypasses auth, seeds rss-demo.db, and locks structural mutations.
# Beta needs DATABASE_URL and BETTER_AUTH_SECRET.
#
# These preview services intentionally run Vite's development server, matching
# their deployment behavior before the repository split. The host and port
# flags are required so Railway can reach the process.

[build]
builder = "RAILPACK"
buildCommand = "bun run build"

[deploy]
# Migrations run before the server boots. If they fail the process exits
# non-zero and the deploy fails, rather than booting against a schema the code
# does not match. (That is exactly how beta broke: drizzle/0001 added
# articles.content, nothing ever applied it, and every article read 500'd.)
#
# db:migrate no-ops when VITE_DEMO_MODE=true, so both services can share this
# command. Without demo mode it requires DATABASE_URL and fails hard.
startCommand = "bun run db:migrate && bun run dev -- --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
